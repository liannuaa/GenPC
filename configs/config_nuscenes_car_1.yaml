# Single nuScenes car partial point cloud demo
paths:
  data_dir: "data"
  gt_dir: "data/GT"
  output_dir: "workspace"
  models_dir: "models"
  hunyuan_repo_root: "../Hunyuan3D-2.1"

models:
  qwen_edit_transformer_path: "nunchaku-qwen-image-edit/nunchaku_qwen_image_2511_balance_int4.safetensors"
  qwen_edit_pipeline_path: "Qwen-Image-Edit-2511"
  rmbg_model_path: "RMBG-2.0"
  hunyuan_model_path: "Hunyuan3D-2.1"

outputs:
  save_intermediates: true

dataset: "kitti"
device: "cuda"

sample_ids: ["car_1"]
input_paths:
  car_1: "data/nuscenes/car_1.ply"
prompt_overrides:
  car_1: "car"

normalize_input: true
input_normalize_range: 0.5

max_samples: null
run_stage1: true
run_stage2: true
run_metric: false

# Depth Prompting
coords_scale: 0.5
distance: 1.6
fovy: 49.1
point_size: 1
mask_pixel_rate: 3
downsample_num: 10000
removal_radius: 10000
camera_distribution: fibonacci_sphere
cam_res: 256
view_num: 256
camera_base: 'kaolin'

# inpaint
res: 256
edge_point_size: 2
generate_res: 1024
depth_image_input_res: 512
qwen_edit_steps: 16
qwen_edit_generate_res: 1024
qwen_edit_true_cfg_scale: 4.0
qwen_edit_negative_prompt: " "

# crop and rescale
rescale: True
padding: 0.15
mask_ratio_thresh: 0.82

inpainter: 'cv2'
rembg_model: 'RMBG'
control_model: "qwen_edit"
generative_model: "hunyuan2.1"

# Hunyuan3D-2.1 shape-only
hunyuan_shape_subfolder: "hunyuan3d-dit-v2-1"
hunyuan_shape_steps: 50
hunyuan_octree_resolution: 384
hunyuan_num_chunks: 8000
hunyuan_point_sample_num: 100000
hunyuan_seed: null
metric_seed: null

# Registration/fusion
reg_fuse_min_distance: 0.0
reg_fuse_max_distance: null
reg_fuse_denoise: true
reg_fuse_denoise_nb_neighbors: 20
reg_fuse_denoise_std_ratio: 2.5
reg_fused_color_hex: "#55aaff"
reg_cd_inv_weight: 0.5
reg_cd_loss: "infocd"
reg_candidate_loss: "model"
reg_compare_yaw_180: true
reg_yaw_180_axis: "y"
reg_diff_init: true
reg_fine_xyz: true
reg_coarse_scale_range: [1.5, 0.5]
reg_coarse_scale_steps: 13
reg_pose_scale_init: 0.75
reg_pose_scale_min: 0.2
reg_pose_scale_max: 0.9
reg_pose_scale_reg_weight: 0.0
reg_pose_iters: 400
reg_pose_cam_bias_num: 8
reg_pose_mask_weight: 0.3
reg_pose_cd_weight: 8.0
reg_pose_cd_inv_weight: 0.0
reg_pose_cd_direction: "complete_to_partial"
reg_fine_scale_ranges:
  - [0.6, 1.4]
  - [0.6, 1.4]
  - [0.6, 1.4]
reg_fine_scale_steps: 9
reg_forward_trim_ratio: 1.0
reg_inverse_trim_ratio: 0.25
reg_torch_refine: false
reg_torch_refine_iters: 120
reg_torch_refine_lr: 0.01
reg_torch_refine_source_points: 2048
reg_torch_refine_target_points: 4096
reg_torch_refine_inverse_weight: 0.15
reg_torch_refine_inverse_trim_ratio: 0.25
reg_torch_refine_scale_min: 0.75
reg_torch_refine_scale_max: 1.25
reg_torch_refine_scale_reg_weight: 0.02
reg_torch_refine_trans_reg_weight: 0.001
reg_torch_refine_rot_reg_weight: 0.001
