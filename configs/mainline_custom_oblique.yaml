paths:
  data_dir: "workspace/mainline_results_20260905/custom/full_pipeline/inputs/partial"
  output_dir: "workspace/mainline_results_20260905/custom/full_pipeline/inputs/camera"
  models_dir: "models"

models:
  qwen_edit_transformer_path: "nunchaku-qwen-image-edit/nunchaku_qwen_image_2511_balance_int4.safetensors"
  qwen_edit_pipeline_path: "Qwen-Image-Edit-2511"
  rmbg_model_path: "RMBG-2.0"

dataset: "custom_oblique"
device: "cuda"
sample_ids:
  - handheld_power_drill
  - mirrorless_camera
  - single_engine_airplane
  - dragon_character
  - hydra_creature
  - domestic_pig
  - light_helicopter
  - cartoon_fox
  - tyrannosaurus_rex_skeleton
  - wolf
prompt_overrides:
  handheld_power_drill: "handheld power drill"
  mirrorless_camera: "modern mirrorless digital camera with one central lens, complete camera body"
  single_engine_airplane: "single-engine airplane"
  dragon_character: "dragon character"
  hydra_creature: "three-headed dragon (hydra) with exactly three distinct heads and long necks"
  domestic_pig: "domestic pig"
  light_helicopter: "light helicopter"
  cartoon_fox: "cartoon fox"
  tyrannosaurus_rex_skeleton: "tyrannosaurus rex skeleton"
  wolf: "wolf"

# Fixed saved-view depth setup shared with the released Redwood mainline.
depth_projection: "view_select"
view_num: 256
downsample_num: 10000
removal_radius: 10000
distance: 1.6
fovy: 49.1
cam_res: 512
res: 512
rescale: true
padding: 0.15
point_size: 1
mask_pixel_rate: 3
save_depth_view_point_cloud: false

# Fixed Qwen depth-to-semantic completion setup.
inpainter: "cv2"
control_model: "qwen_edit"
generate_res: 512
depth_image_input_res: 512
qwen_edit_depth_input_name: "raw_depth.png"
qwen_edit_steps: 40
qwen_edit_generate_res: 1024
qwen_edit_true_cfg_scale: 4.0
qwen_edit_negative_prompt: " "
