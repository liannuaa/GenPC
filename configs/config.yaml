# Experiment
paths:
  data_dir: "data"
  gt_dir: "data/GT"
  output_dir: "workspace"
  models_dir: "models"
  hunyuan_repo_root: "../Hunyuan3D-2.1"

models:
  qwen_transformer_path: "nunchaku-qwen-image/svdq-int4_r128-qwen-image-lightningv1.0-4steps.safetensors"
  qwen_pipeline_path: "Qwen-Image"
  qwen_controlnet_path: "Qwen-Image-ControlNet-Union"
  rmbg_model_path: "RMBG-2.0"
  hunyuan_model_path: "Hunyuan3D-2.1"

outputs:
  save_intermediates: true # keep img.png and other intermediates during optimization

dataset: "redwood" # redwood, pcn, scannet
device: "cuda"
sample_ids:
  - "01184"
  - "05117"
  - "05452"
  - "06127"
  - "06145"
  - "06188"
  - "06830"
  - "07136"
  - "07306"
  - "09639"
max_samples: null # set an integer to truncate auto-discovered samples
run_stage1: true
run_stage2: true
run_metric: true

# Depth Prompting
coords_scale: 0.5
distance: 1.6 # 1.6 cameras distance
fovy: 49.1 # cameras fov
point_size: 1 #2
mask_pixel_rate: 3
downsample_num: 10000
removal_radius: 10000 # hidden point removal radius
camera_distribution: fibonacci_sphere
cam_res: 256  # 256 rendering res
view_num: 256 # if view_num=6, is orthogonal camera
camera_base: 'kaolin'  # blender, kaolin

# inpaint
res: 256 # inpainting resolution
edge_point_size: 2
generate_res: 1024
qwen_depth_input_res: 512

# crop and rescale
rescale: True  #
padding: 0.15
mask_ratio_thresh: 0.82 # 0.82 for everything else, 0.5 for diffPIR

inpainter: 'cv2' # [‘flux’, 'DDNM'，cv2]
rembg_model: 'RMBG' # ['rembg', 'RMBG']
control_model: "qwen" # default image generator; ['controlnet', 'adapter', flux, qwen]
generative_model: "hunyuan2.1" # default 3D generator; ['instantmesh', 'hunyuan2.1', 'hunyuan2.0', sf3d, trellis, trellis_2]

# Hunyuan3D-2.1 shape-only
hunyuan_shape_subfolder: "hunyuan3d-dit-v2-1"
hunyuan_shape_steps: 50
hunyuan_octree_resolution: 384
hunyuan_num_chunks: 8000
hunyuan_point_sample_num: 100000
hunyuan_seed: null
metric_seed: null
metric_seed_overrides:
  "06830": 16
metric_indices_dir: "workspace/metric_indices"
metric_save_indices: false

# Registration/fusion. Registration must only use partial and generated point clouds.
# GT point clouds are reserved for metric evaluation only.
reg_fuse_min_distance: 0.0
reg_fuse_max_distance: null
reg_fuse_denoise: false
reg_cd_inv_weight: 0.5
reg_cd_loss: "infocd"
reg_candidate_loss: "model"
reg_diff_init: true
reg_fine_xyz: true
reg_coarse_scale_range: [1.5, 0.5]
reg_coarse_scale_steps: 13
reg_pose_scale_init: 0.75
reg_pose_scale_min: 0.2
reg_pose_scale_max: 0.9
reg_pose_scale_reg_weight: 0.0
reg_pose_iters: 400
reg_pose_cam_bias_num: 8
reg_pose_mask_weight: 0.3
reg_pose_cd_weight: 8.0
reg_pose_cd_inv_weight: 0.0
reg_pose_cd_direction: "complete_to_partial"
reg_fine_scale_ranges:
  - [0.6, 1.4]
  - [0.6, 1.4]
  - [0.6, 1.4]
reg_fine_scale_steps: 9
reg_forward_trim_ratio: 1.0
reg_inverse_trim_ratio: 0.25
reg_torch_refine: false
reg_torch_refine_iters: 120
reg_torch_refine_lr: 0.01
reg_torch_refine_source_points: 2048
reg_torch_refine_target_points: 4096
reg_torch_refine_inverse_weight: 0.15
reg_torch_refine_inverse_trim_ratio: 0.25
reg_torch_refine_scale_min: 0.75
reg_torch_refine_scale_max: 1.25
reg_torch_refine_scale_reg_weight: 0.02
reg_torch_refine_trans_reg_weight: 0.001
reg_torch_refine_rot_reg_weight: 0.001
