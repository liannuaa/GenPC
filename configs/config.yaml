# Experiment
paths:
  data_dir: "data"
  gt_dir: "data/GT"
  output_dir: "workspace"
  models_dir: "models"
  hunyuan_repo_root: "../Hunyuan3D-2.1"

models:
  qwen_edit_transformer_path: "nunchaku-qwen-image-edit/nunchaku_qwen_image_2511_balance_int4.safetensors"
  qwen_edit_pipeline_path: "Qwen-Image-Edit-2511"
  rmbg_model_path: "RMBG-2.0"
  hunyuan_model_path: "Hunyuan3D-2.1"
  hunyuan_omni_model_path: "Hunyuan3D-Omni"
  moge_model_path: "moge-2-vitl"

outputs:
  save_intermediates: false # set true to keep every debug/intermediate artifact
  keep_profile: "lean" # lean keeps only useful pipeline artifacts; debug/full keeps all

dataset: "redwood" # redwood, pcn, scannet
device: "cuda"
sample_ids:
  - "01184"
  - "05117"
  - "05452"
  - "06127"
  - "06145"
  - "06830"
  - "06188"
  - "07136"
  - "07306"
  - "09639"
max_samples: null # set an integer to truncate auto-discovered samples
prompt_overrides:
  "05117": "red chair"
  "06127": "terracotta flower pot with leafy plant"
  "06188": "red motorcyle"
  "07136": "leather sofa"
  "07306": "Office Trash Can"
run_stage1: true
run_stage2: true
run_metric: true

# Depth Prompting
coords_scale: 0.5
distance: 1.6 # 1.6 cameras distance
fovy: 49.1 # cameras fov
point_size: 1 #2
mask_pixel_rate: 3
downsample_num: 10000
removal_radius: 10000 # hidden point removal radius
camera_distribution: fibonacci_sphere
cam_res: 512  # camera/intrinsics resolution; keep aligned with depth raster res
view_num: 256 # if view_num=6, is orthogonal camera
camera_base: 'kaolin'  # blender, kaolin
save_depth_view_point_cloud: false
depth_projection: "view_select" # original max-visible-points projection
reference_eye_direction: [-0.14270581, -0.75454755, -0.64054122]
reference_camera_up: [0.39445910, -0.63690607, 0.66238408]
canonical_up_axis: "z"
canonical_elevations: [0]
canonical_azimuths: [90, 270]
canonical_visibility: "all" # preserve the full partial scan, matching point-cloud viewers
canonical_score_res: 160
canonical_score_point_size: 5
canonical_score_weights:
  visible: 0.28
  grid: 0.18
  connected: 0.18
  solidity: 0.16
  fill: 0.08
  aspect: 0.12

# inpaint
res: 512 # projected depth and inpainting resolution
edge_point_size: 2
generate_res: 512
depth_image_input_res: 512
qwen_edit_steps: 16
qwen_edit_generate_res: 1024
qwen_edit_true_cfg_scale: 4.0
qwen_edit_negative_prompt: " "
qwen_edit_refine_stage: true
qwen_edit_refine_steps: 16

# crop and rescale
rescale: True  #
padding: 0.15
mask_ratio_thresh: 0.82 # 0.82 for everything else, 0.5 for diffPIR

inpainter: 'cv2' # [‘flux’, 'DDNM'，cv2]
rembg_model: 'RMBG' # ['rembg', 'RMBG']
control_model: "qwen_edit" # default image generator; controlnet, adapter, flux, qwen_edit
generative_model: "hunyuan2.1" # default 3D generator; ['instantmesh', 'hunyuan2.1', 'hunyuan2.0', sf3d, trellis, trellis_2]

# Hunyuan3D-2.1 shape-only
hunyuan_shape_subfolder: "hunyuan3d-dit-v2-1"
hunyuan_shape_steps: 50
hunyuan_octree_resolution: 384
hunyuan_num_chunks: 8000
hunyuan_point_sample_num: 100000
hunyuan_seed: null
hunyuan_omni_steps: 50
hunyuan_omni_octree_resolution: 512
hunyuan_omni_guidance_scale: 4.5
hunyuan_omni_point_file: "color_point.ply"
hunyuan_omni_normalize_point_control: true
hunyuan_omni_point_normalize: "bbox" # bbox, none
hunyuan_omni_point_scale: 0.98
hunyuan_omni_fast_decode: false
hunyuan_omni_postprocess: true
metric_seed: null
metric_seed_overrides:
  "06830": 16
metric_indices_dir: "workspace/metric_indices"
metric_save_indices: false

# Registration/fusion. Registration must only use partial and generated point clouds.
# GT point clouds are reserved for metric evaluation only.
# Default ScanSalon/Hunyuan-Omni registration is GeoTransformer-only; do not chain
# the legacy 2D pose optimization, ICP, or torch refinement after it.
reg_backend: "render_to_moge_sim3" # render_to_moge_sim3, geotransformer, legacy, one_sided
moge_fp16: true
moge_bridge_max_pixel_distance: 2.0
moge_bridge_ransac_iterations: 5000
moge_bridge_ransac_threshold: 0.08
moge_bridge_max_correspondences: 4000
object_alpha_threshold: 128
object_mask_erode_pixels: 2
render_moge_object_mask_erode_pixels: 0
render_sim3_eval_points: 60000
render_sim3_seed: 6145
render_sim3_splat_radius: 1
render_sim3_scale_multipliers: "0.55,0.7,0.85,1.0,1.15,1.3"
render_sim3_translation_steps: "0.12,0.06,0.03,0.015"
render_sim3_rotation_steps_deg: "12,6,3"
render_sim3_scale_steps: "1.12,1.06,1.03"
