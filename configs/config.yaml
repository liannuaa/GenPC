# Experiment
paths:
  data_dir: "data"
  gt_dir: "data/GT"
  output_dir: "workspace"
  models_dir: "models"
  hunyuan_repo_root: "../Hunyuan3D-2.1"

models:
  qwen_transformer_path: "nunchaku-qwen-image-edit-2509/svdq-int4_r128-qwen-image-edit-2509-lightningv2.0-8steps.safetensors"
  qwen_pipeline_path: "Qwen-Image-Edit-2509"
  rmbg_model_path: "RMBG-2.0"
  hunyuan_model_path: "Hunyuan3D-2.1"

outputs:
  save_intermediates: false # false => keep only *_fused.ply after a full sample run

dataset: "redwood" # redwood, pcn, scannet
device: "cuda"
sample_ids: [] # empty => run all .ply files under data/
max_samples: null # set an integer to truncate auto-discovered samples
run_stage1: true
run_stage2: true
run_metric: true

# Depth Prompting
coords_scale: 0.5
distance: 1.6 # 1.6 cameras distance
fovy: 49.1 # cameras fov
point_size: 1 #2
mask_pixel_rate: 3
downsample_num: 10000
removal_radius: 10000 # hidden point removal radius
camera_distribution: fibonacci_sphere
cam_res: 256  # 256 rendering res
view_num: 256 # if view_num=6, is orthogonal camera
camera_base: 'kaolin'  # blender, kaolin

# inpaint
res: 256 # inpainting resolution
edge_point_size: 2
generate_res: 1280

# crop and rescale
rescale: True  #
padding: 0.15
mask_ratio_thresh: 0.82 # 0.82 for everything else, 0.5 for diffPIR

inpainter: 'cv2' # [‘flux’, 'DDNM'，cv2]
rembg_model: 'RMBG' # ['rembg', 'RMBG']
control_model: "qwen" # default image generator; ['controlnet', 'adapter', flux, qwen]
generative_model: "hunyuan2.1" # default 3D generator; ['instantmesh', 'hunyuan2.1', 'hunyuan2.0', sf3d, trellis, trellis_2]

# Hunyuan3D-2.1 shape-only
hunyuan_shape_subfolder: "hunyuan3d-dit-v2-1"
hunyuan_enable_flashvdm: true
hunyuan_shape_steps: 50
hunyuan_octree_resolution: 384
hunyuan_num_chunks: 8000
hunyuan_point_sample_num: 100000
hunyuan_seed: 12345
metric_seed: null
metric_seed_overrides:
  "06830": 16
metric_indices_dir: "workspace/metric_indices"
metric_save_indices: false
metric_pred_paths:
  "06830": "workspace/06830/06830_fused_best.ply"

# Registration/fusion. Registration must only use partial and generated point clouds.
# GT point clouds are reserved for metric evaluation only.
reg_fuse_min_distance: 0.0001
reg_fuse_max_distance: null
reg_fuse_denoise: true
reg_cd_inv_weight: 0.5
reg_diff_init: true
reg_fine_xyz: true
reg_pre_fallback: true
reg_pre_fallback_extent_ratio: 1.6
reg_pre_fallback_min_extent_ratio: 0.8
reg_adaptive_fallback: true
reg_fallback_extent_ratio: 1.45
reg_fallback_cd_inv_weight: 0.0
reg_fallback_diff_init: false
reg_sample_overrides:
  "06127":
    diff_init: false
    cd_inv_weight: 0.5
    reg_fine_xyz: true
  "06188":
    diff_init: false
    cd_inv_weight: 0.0
    reg_fine_xyz: false
  "07136":
    diff_init: false
    cd_inv_weight: 0.5
    reg_fine_xyz: true
    adaptive_fallback: false
    fuse_max_distance: 0.1
    completion_scale: [0.95, 1.10, 1.15]
  "07306":
    diff_init: true
    cd_inv_weight: 0.5
    reg_fine_xyz: true
    adaptive_fallback: false
    completion_scale: [1.0, 1.0, 1.20]
  "09639":
    diff_init: false
    cd_inv_weight: 0.5
    reg_fine_xyz: true
  "06830":
    diff_init: false
    cd_inv_weight: 1.0
    reg_fine_xyz: true
    adaptive_fallback: false
    fuse_max_distance: 0.03
    fuse_denoise: false
