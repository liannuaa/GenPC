# Experiment
output_path: 'workspace' # output dir
save: True # Saving intermediate files
dataset: "redwood" # redwood, pcn, scannet
device: "cuda"
sample_ids: [] # empty => run all .ply files under data/
max_samples: null # set an integer to truncate auto-discovered samples
run_stage1: true
run_stage2: true
run_metric: true

# Depth Prompting
coords_scale: 0.5
distance: 1.6 # 1.6 cameras distance
fovy: 49.1 # cameras fov
point_size: 1 #2
mask_pixel_rate: 3
downsample_num: 10000
removal_radius: 10000 # hidden point removal radius
camera_distribution: fibonacci_sphere
cam_res: 256  # 256 rendering res
view_num: 256 # if view_num=6, is orthogonal camera
camera_base: 'kaolin'  # blender, kaolin

# inpaint
res: 256 # inpainting resolution
edge_point_size: 2
generate_res: 512

# crop and rescale
rescale: True  #
padding: 0.15
mask_ratio_thresh: 0.82 # 0.82 for everything else, 0.5 for diffPIR

inpainter: 'cv2' # [‘flux’, 'DDNM'，cv2]
rembg_model: 'RMBG' # ['rembg', 'RMBG']
control_model: "qwen" # default image generator; ['controlnet', 'adapter', flux, qwen]
generative_model: "hunyuan2.0" # default 3D generator; ['instantmesh', 'hunyuan2.0', sf3d, trellis, trellis_2]

# Hunyuan3D-2.0
hunyuan_model_path: "models/Hunyuan3D-2-ms"
hunyuan_shape_subfolder: "hunyuan3d-dit-v2-0"
hunyuan_paint_subfolder: "hunyuan3d-paint-v2-0"
hunyuan_enable_flashvdm: true
hunyuan_shape_steps: 50
hunyuan_octree_resolution: 380
hunyuan_num_chunks: 20000
hunyuan_point_sample_num: 100000
hunyuan_seed: 12345
hunyuan_paint: false

# TRELLIS.2
trellis2_model_path: "models/TRELLIS.2-4B" # default TRELLIS.2 checkpoint
